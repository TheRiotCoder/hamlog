# HamLog on its own origin: Cloudflare Pages project "hamlog" (https://hamlog-azm.pages.dev), static files only, no Functions.
# Deploy: sh tools/build-site.sh && npx wrangler pages deploy dist --project-name hamlog --branch main
# Needs CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID in the environment - never commit them.
name = "hamlog"
compatibility_date = "2026-09-01"
pages_build_output_dir = "./dist"
